name: One-time v2.1.4 in-place refresh
on:
  push:
    branches: [main]
    paths: [.github/workflows/repack-v214.yml]
permissions:
  contents: write
jobs:
  github:
    if: "github.event.head_commit.message == 'ops: republish v2.1.4 in place'"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and validate unchanged v2.1.4
        shell: pwsh
        run: |
          if ((Get-Content manifest.json -Raw | ConvertFrom-Json).version -ne '2.1.4') { throw 'Unexpected version' }
          npm ci
          npm run build:windows
          node scripts/create-update-manifest.mjs --repository "${{ github.repository }}" --tag v2.1.4 --xpi dist/litmtrans-2.1.4.xpi --out dist/update.json --announcements docs/announcements.json
      - name: Replace existing published assets, do not create a new release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.1.4 dist/litmtrans-2.1.4.xpi dist/update.json --clobber --repo "${{ github.repository }}"
          gh release view v2.1.4 --repo "${{ github.repository }}" --json assets
      - name: Point existing tag to updated source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/v2.1.4" -f sha="${{ github.sha }}" -F force=true
  gitee:
    needs: github
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITEE_REPOSITORY: SRT117/LitMTrans-Zotero
      GITEE_API_BASE: https://api.gitee.com/api/v5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download updated GitHub release assets
        run: |
          mkdir -p dist/gitee
          gh release download v2.1.4 --repo "${{ github.repository }}" --pattern '*.xpi' --dir dist/gitee
          test "$(find dist/gitee -maxdepth 1 -name '*.xpi' | wc -l)" -eq 1
          node scripts/create-update-manifest.mjs --repository "$GITEE_REPOSITORY" --tag v2.1.4 --xpi dist/gitee/litmtrans-2.1.4.xpi --out dist/gitee/update.json --download-base "https://gitee.com/$GITEE_REPOSITORY/releases/download" --announcements docs/announcements.json
      - name: Synchronize source and existing tag to Gitee
        run: |
          test -n "$GITEE_ACCESS_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add gitee "https://gitee.com/$GITEE_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://gitee.com/.extraheader"
          OWNER="${GITEE_REPOSITORY%%/*}"
          BASIC="$(printf '%s:%s' "$OWNER" "$GITEE_ACCESS_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0="Authorization: Basic $BASIC"
          git fetch gitee main
          git checkout -B gitee-sync FETCH_HEAD
          git merge --no-edit --no-ff "$GITHUB_SHA"
          git push gitee gitee-sync:main
          git tag -f v2.1.4 "$GITHUB_SHA"
          git push --force-with-lease gitee refs/tags/v2.1.4
      - name: Replace Gitee assets and update public manifest
        run: |
          node scripts/publish-gitee-release.mjs --repository "$GITEE_REPOSITORY" --tag v2.1.4 --xpi dist/gitee/litmtrans-2.1.4.xpi --update-manifest dist/gitee/update.json
          curl --fail --silent --show-error --location "https://gitee.com/$GITEE_REPOSITORY/raw/main/update.json" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const a=JSON.parse(d).addons["litmtrans@srt117.github.io"].updates[0];if(a.version!=="2.1.4")process.exit(1)})'
