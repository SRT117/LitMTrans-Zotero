name: 功能建议
description: 提议一个明确的使用场景或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 请描述需要解决的问题，不要提交 API Key、论文正文或其他敏感内容。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 目前在什么情况下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的处理方式
      description: 描述期望的操作和结果，不需要提供具体实现方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式
      description: 可留空。如果目前有临时解决办法，请在这里说明。
